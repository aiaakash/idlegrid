# Coolify deployment for the console (Docker Compose build pack).
# In Coolify: Docker Compose resource -> Docker Compose Location:
#   /docker-compose.yml   (root — subdirectory locations hit a Coolify bug)
services:
  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=${CONSOLE_API_URL:-http://idlegrid-api:8080}
    ports:
      - "3000"
